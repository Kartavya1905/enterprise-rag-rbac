# Demo personas for Orbitra Systems (a fictional company).
# Each one exercises a different part of the access policy. Phase 3 seeds them as login
# users (scripts/seed_users.py, which logs in with email); the RBAC leak tests (Phase 11)
# attack the system as each of them.

personas:
  - user_id: u_intern
    name: Aarav Mehta
    email: aarav.mehta@orbitra.example
    title: Software Engineering Intern
    role: intern
    clearance: 1
    departments: [engineering]

  - user_id: u_engineer
    name: Lena Okafor
    email: lena.okafor@orbitra.example
    title: Software Engineer II
    role: employee
    clearance: 2
    departments: [engineering]

  - user_id: u_sales_rep
    name: Marco Bellini
    email: marco.bellini@orbitra.example
    title: Account Executive
    role: employee
    clearance: 2
    departments: [sales]

  # Granted the finance cloud-cost review by name (need-to-know via allowed_users).
