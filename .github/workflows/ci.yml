# =============================================================================
# FILE:         .github/workflows/ci.yml
# WHAT IT DOES: GitHub Actions "continuous integration". On every push and pull request
#               GitHub runs these checks on a fresh Linux machine and marks the commit
#               green (all passed) or red (something broke).
# WHERE IT FITS: Phase 12. The automatic safety net for every future change.
#
#   lint ──┐
#   test ──┼──> all must pass
#   audit ─┤    (they run in parallel)
#   docker ┘
#
# COST: free. GitHub Actions is unlimited for public repositories and includes 2,000
# minutes a month for private ones; one full run here takes about 10 minutes.
# No secrets are needed: CI uses the offline fakes and a throwaway Docker stack.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # "Run workflow" button in the Actions tab

# Read-only token: CI only checks code, it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: lint - code style and common bugs (ruff), in seconds
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  # ---------------------------------------------------------------------------
  # JOB 2: test - the whole everyday pytest suite, including the RBAC leak suite
  # (45 attacks x 9 personas), on both supported Python versions.
  # "slow" tests (real Ollama LLM) are skipped: CI has no GPU and no model server.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The embedding models (~65 MB) are downloaded once and reused by later runs.
      - uses: actions/cache@v4
        with:
          path: data/models
          key: models-${{ hashFiles('app/core/config.py') }}
      - run: pip install -e ".[dev]"
      - run: pytest

  # ---------------------------------------------------------------------------
  # JOB 3: audit - are any installed libraries known to be vulnerable? (free OSV/PyPI data)
  # ---------------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # A fresh pip first: the runner's bundled pip can itself have known vulnerabilities.
      - run: python -m pip install --upgrade pip
      - run: pip install . pip-audit
      - run: pip-audit --skip-editable

  # ---------------------------------------------------------------------------
  # JOB 4: docker - build the real image, start the real stack (Postgres + Qdrant +
  # API), load the documents, then check access control through the running API.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The container runs as a non-root user; let it write the mounted data folders.
      - run: chmod -R a+w data/raw data/processed data/org
      # --wait returns once every service reports healthy (or fails if one never does).
      - run: docker compose up -d --build --wait
      - name: Bootstrap (seed users, ingest, index)
        run: docker compose exec -T api python -m scripts.bootstrap --skip-llm-check
      - name: Smoke test the running API
        run: docker compose exec -T api python -m scripts.smoke_test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
